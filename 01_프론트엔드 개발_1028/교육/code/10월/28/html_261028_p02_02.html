<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1">
        <title>블루베리 팔아요</title>
        <script>
            var num1= 10;
            var num2= 20;
            var result;
            
            num1--;
            document.write(num1, "<br>");
            num1++;
            document.write(num2, "<br>");

            result=num2++;
            document.write(result, num2, "<br>");
            result=++num2;
            document.write(result, num2, "<br>");

        </script>
    </head>
    <body>

    </body>
</html>
