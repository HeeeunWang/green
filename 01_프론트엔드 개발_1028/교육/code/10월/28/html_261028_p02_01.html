<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1">
        <title>블루베리 팔아요</title>
        <script>
            var t1= "학교종이";
            var t2= " 땡땡땡 ";
            var t3= 8282;
            var t4= " 어서 모이자<br>";
            var result= t1+t2+t3+t4;
            document.write(result);

            var num1= 10;
            var num2= 3;
            num1 += num2;
            document.write(num1, "<br>");
            num1 -= num2;
            document.write(num1, "<br>");
            num1 *= num2;
            document.write(num1, "<br>");
            num1 %= num2;
            document.write(num1, "<br>");
            
            var str= "<table border='1'>";                
            str += "<tr>";
            str += "<td>1</td><td>2</td><td>3</td>";
            str += "</tr>";
            str += "</table>";
            document.write(str);
        </script>
