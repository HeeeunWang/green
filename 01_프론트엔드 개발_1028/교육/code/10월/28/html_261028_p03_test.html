<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1">
        <title>블루베리 팔아요</title>
        <script>
            var i= prompt("두 개의 숫자를 입력받아 사칙연산 계산! \n첫번째 숫자", 0);
            var j= prompt("두 개의 숫자를 입력받아 사칙연산 계산! \n두번째 숫자", 0);
            
            var plus= i*1+j*1;
            // var plus= i+j;
            var minus= i-j;
            var multi= i*j;
            var divd= i/j;
            
            document.write("입력 숫자: ", i, ", ", j, "<br>");
            document.write(i, " + ", j, " = ", plus, "<br>");
            document.write(i, " - ", j, " = ", minus, "<br>");
            document.write(i, " * ", j, " = ", multi, "<br>");
            document.write(i, " / ", j, " = ", divd, "<br>");
        </script>
    </head>
    <body>

    </body>
</html>
