<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1">
        <title>블루베리 팔아요</title>
        <script>
            var month= prompt("현재는 몇 월 입니까?", "");

            if (month>=3 && month<6){
                document.write("따듯한 봄입니다.");
            }else if(month>=6 && month<9){
                document.write("더운 여름입니다.");
            }else if(month>=9 && month<12){
                document.write("시원한 가을입니다.");
            }else{
                document.write("추운 겨울입니다.");
            }
        </script>
    </head>
    <body>

    </body>
</html>
