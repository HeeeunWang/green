<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1">
        <title>블루베리 팔아요</title>
        <script>
            var num = 0;
            function testFnc(){
                num++;
                document.write(num, "<br>")
                if(num==10) return;
                testFnc()
                num--;
                document.write(num, "<br>")
            }
            testFnc();

            function ranData(){
                var date = new Date();
                var x = date.getSeconds();
                var y = (x%5)+1;
                alert("난수 = " + y);
            }
        </script>
    </head>
    <body>
        <button onclick="ranData()">난수 발생</button>
        <a href="#" onclick="ranData()">난수 발생</a>
    </body>
</html>
