<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1">
        <title>블루베리 팔아요</title>
        <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>   
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script>
            $(
                function(){
                    $(".chii").on(
                        {
                            "mouseover": function(){
                                $(".main2img1").next().css({"background":"lightpink","color":"white"})
                                .text("우 우와와 우와!")
                            },
                            "mouseout": function(){
                                $(".main2img1").next().css({"background":"none","color":"black"})
                                .text("치이카와")
                            }
                        }
                    )
                    $(".hachi").on(
                        {
                            "mouseover": function(){
                                $(".main2img2").next().css({"background":"lightblue","color":"white"})
                                .text("어떻게던 되어라~")
                            },
                            "mouseout": function(){
                                $(".main2img2").next().css({"background":"none","color":"black"})
                                .text("하치와레")
                            }
                        }
                    )
                    $(".saki").on(
                        {
                            "mouseover": function(){
                                $(".main2img3").next().css({"background":"lightyellow","color":"gray"})
                                .text("뿌륏~")
                            },
                            "mouseout": function(){
                                $(".main2img3").next().css({"background":"none","color":"black"})
                                .text("우사기")
                            }
                        }
                    )
                }
            )
            function randomchii(init){
                var imgTag = document.getElementById("randomchii_img");
                if(init){
                    imgTag.setAttribute("src", "pic_00.jpg");
                }else{
                    var ran = Math.ceil( Math.random() * 8);
                    console.log("pic_0"+ran)
                    imgTag.setAttribute("src", "pic_0"+ran+".png");
                }
            }
        </script>
        <style>
            .header{
                background: rgb(247, 215, 255);
            }
            .header .nav-link{
                color: rgb(139, 20, 110);
            }
            .header .nav-link:hover{
                color: white;
                background: rgb(139, 20, 110);
            }
             .carousel img{
                max-height: 650px;
             }
             .randomchii img{
                max-height: 300px;
                width: auto;
             }
             .randomchii *{
                display: block;
                margin: 10px auto;
             }
             @media screen and (min-width: 1200px) {
                #container{
                    width: 750px;
                    height: auto;
                    padding: 10px;
                    box-sizing: border-box;
                    flex-wrap: wrap;
                }
                .headerbox, .footerbox, .box5{
                    width: 80%;
                }
                .box1, .box2, .box3, .box4, .box5{
                    width: 50%;
                }
                .box5{
                    flex: 2 2 0;
                }
            }
        </style>
    </head>
    <body>
        <div class="header container-fluid">
            <ul class="nav justify-content-end">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">네비01</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">네비02</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">네비03</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">네비03</a>
                </li>
            </ul>
        </div>
        <div class="mainbox1 container-fluid mw-70 my-3">
            <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1" aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="2" aria-label="Slide 3"></button>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item active" data-bs-interval="3000">
                        <img src="캐러샐_이미지01.jpg" class="d-block mx-auto container-fluid" alt="">
                    </div>
                    <div class="carousel-item" data-bs-interval="3000">
                        <img src="캐러샐_이미지02.jpg" class="d-block  mx-auto container-fluid" alt="">
                    </div>
                    <div class="carousel-item" data-bs-interval="3000">
                        <img src="캐러샐_이미지03.jpg" class="d-block  mx-auto container-fluid" alt="">
                    </div>
                </div>
                <button class="btn btn-light carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true" ></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="btn btn-light carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>
        <div class="mainbox2 container-fluid text-center my-3">
            <div class="row">
                <div class="col chii">
                    <img src="치이.jpg" alt="" class="main2img1 d-block mx-auto container-fluid">
                    <a href="#" class="d-block">치이카와</a>
                </div>
                <div class="col hachi">
                    <img src="하치.jpg" alt="" class="main2img2 d-block mx-auto container-fluid">
                    <a href="#" class="d-block">하치와레</a>
                </div>
                <div class="col saki">
                    <img src="사기.jpg" alt="" class="main2img3 d-block mx-auto container-fluid">
                    <a href="#" class="d-block">우사기</a>
                </div>
            </div>
        </div>

        <div class="mainbox3 container-fluid border my-3">
            <div class="randomchii">
                <h2 class="text-center">오늘의 먼작귀 만나기!</h2>
                <button type="button" value="만나보기" onclick="randomchii(0)">만나보기!</button>                
                <img id="randomchii_img" src="pic_00.jpg">
                <button type="button" value="초기화" onclick="randomchii(1)">초기화!</button>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>    
</html>
