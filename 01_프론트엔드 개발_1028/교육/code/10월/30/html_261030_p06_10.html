<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1">
        <title>블루베리 팔아요</title>
        <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>        
        <script>
            function addHtml(){
                $("#article").append("안녕하세요"+"</br>");
            }
            function addImage(){
                $(".class1").html("<img src=\"../27/아노코.jpg\" alt=\"아노코\">")
            }
            function addImage2(){
                $("section").html("<img src=\"../27/해피멍뭉.jpg\" alt=\"해피멍뭉\">")
            }
            function fn_process(){
                var value = $("#t_input").val();
                $("#t_output").val(value);
            }
        </script>
        <style>

        </style>
    </head>
    <body>
        <div>
            <p id="article"></p>
        </div>
        <input type="button" value="추가하기" onclick="addHtml()">

        <div class="class1"></div>
        <div class="class1"></div>
        <input type="button" value="추가하기" onclick="addImage()">
        <section></section>
        <section></section>
        <section class="sec1"></section>
        <input type="button" value="추가하기" onclick="addImage2()">
        <p>입력: </p>
        <input type="text" id="t_input">
        <input type="button" value="입력하기" onclick="fn_process()">
        <p>결과: </p>
        <input type="text" id="t_output" disabled>
    </body>
</html>
