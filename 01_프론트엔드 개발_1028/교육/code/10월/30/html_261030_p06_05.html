<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1">
        <title>블루베리 팔아요</title>
        <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
        <script>
            $(
                function(){
                    var obj = [
                        {"area":"서울"},
                        {"area":"부산"},
                        {"area":"전주"},
                    ];
                    $(obj).each(
                        function(i, o){
                            console.log(i, ":", o);
                        }
                    )
                    console.log("==== The End 1 ====");
                    $.each(
                        $("#menu2 li"), function(i, o){
                            console.log(i, ":", o);
                        }
                    )
                    console.log("==== The End 2 ====");
                    $("#menu1 li").each(
                        function(i, o){
                            console.log(i, ":", $(this))
                        }
                    )

                }
                
            );            
            
        </script>
        <style>
            *{}
        </style>
    </head>
    <body>
        <h1>탐색 선택자</h1>
        <ul id="menu1">
            <li>메뉴 1-1</li>
            <li>메뉴 1-2</li>
            <li>메뉴 1-3</li>
        </ul>
        <ul id="menu2">
            <li>메뉴 2-1</li>
            <li>메뉴 2-2</li>
            <li>메뉴 2-3</li>
        </ul>
    </body>
</html>
