<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1">
        <title>블루베리 팔아요</title>
        <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>        
        <script>
            $(
                function(){
                    var result_01 = $("#chk1").prop("checked");
                    console.log(result_01);
                    var result_02 = $("#chk2").prop("checked");
                    console.log(result_02);
                    var result_03 = $("#chk3").prop("checked", true);
                    console.log(result_03);
                    var result_04 = $("#se_01").prop("selectedIndex");
                    console.log(result_04);
                }
            );
        </script>
        <style>
            *{}
        </style>
    </head>
    <body>
        <h1><strong>객체 조작 및 생성</strong></h1>
        <form action="#" id="form_01">
            <p>
                <input type="checkbox" name="chk1" id="chk1">
                <label for="chk1">chk1</label>
                <input type="checkbox" name="chk2" id="chk2" checked>
                <label for="chk2">chk2</label>
                <input type="checkbox" name="chk3" id="chk3">
                <label for="chk3">chk3</label>
            </p>
            <p>
                <select name="se_01" id="se_01">
                    <option value="op11">option1</option>
                    <option value="opt2">option2</option>
                    <option value="opt3" selected>option3</option>
                </select>
            </p>
        </form>
    </body>
</html>
