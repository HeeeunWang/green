<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1">
        <title>블루베리 팔아요</title>
        <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>        
        <script>
            $(
                function(){
                    $(".btn1").click(
                        function(){
                            $(".btn1").parent().next().css({"color":"red"});
                        }
                    );
                    $(".btn2").on(
                        {
                            "mouseover focue": function(){
                                $(".btn2").parent().next().css({"color":"blue"});
                            },
                            "mouseout blur": function(){
                                $(".btn2").parent().next().css({"color":"green"});
                            }
                        }
                    )
                    $(".btn1").click();
                    $(".btn2").trigger("mouseover");
                }                
            )
        </script>
        <style>

        </style>
    </head>
    <body>
        <p><button class="btn1">버튼1</button></p>
        <h1>제목1</h1>
        <p>내용1</p>
        <p><button class="btn2">버튼2</button></p>
        <h1>제목2</h1>
        <p>내용2</p>
    </body>
</html>
