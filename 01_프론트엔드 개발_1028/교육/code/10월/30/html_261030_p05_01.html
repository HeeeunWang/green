<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1">
        <title>블루베리 팔아요</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <style>
            *{
                margin:0;
                padding:0;
            }
            img{                
                /* display: block;
                margin: 0 auto;
                border: 1px solid gray; */
            }
            h1{
                text-align: center;
            }
            #galleryZone{
                position: relative;
                margin: 0 auto;
                text-align: center;
                width: 700px;
                height: 400px;
                margin-bottom: 10px;
            }
            #galleryZone input[type="image"]{
                margin: 0 8px;                
            }
            .bfbutton{
                position: absolute;
                left: 0;
                bottom: 0;
                width: 100px;
            }
            .nxbutton{
                position: absolute;
                right: 0;
                bottom: 0;
                width: 100px;
            }
        </style>
        <script>
            var galnum = 1;
            function gallery(direct){
                if(direct){
                    if(galnum==8) return
                    galnum++;
                }else{
                    if(galnum==1) return
                    galnum--;
                }
                var imgTag = document.getElementById("photo");
                imgTag.setAttribute("src", "pic_0"+galnum+".png");
            }
        </script>
    </head>
    <body>        
        <h1>이곳은 당신의 갤러리!</h1>
        <div id="galleryZone">
            <img src="../29/pic_01.png" id="photo" class="img-thumbnail fluid" alt="">
            <button type="button" class= "btn btn-outline-success bfbutton" onclick="gallery(0)">이전</button>
            <button onclick="gallery(1)" class="nxbutton btn btn-danger">다음</button>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
