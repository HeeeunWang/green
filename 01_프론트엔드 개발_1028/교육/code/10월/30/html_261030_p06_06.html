<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1">
        <title>블루베리 팔아요</title>
        <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>        
        <script>
            $(
                function(){
                    var srcVal = $("#sec_01 img").attr("src");
                    console.log(srcVal);
                    $("#sec_01 img").attr(
                        {
                            "width": 300,
                            "src": srcVal.replace("아노코", "해피멍뭉"),
                            "alt": "멍뭉"
                        }
                    )
                    .removeAttr("border");
                }
            );
        </script>
        <style>
            *{}
        </style>
    </head>
    <body>
        <h1><strong>객체 조작 및 생성</strong></h1>
        <section id="sec_01">
            <h2>이미지 속성</h2>
            <p>
                <img src="../27/아노코.jpg" alt="꺄호" border="2">
            </p>
        </section>
    </body>
</html>
