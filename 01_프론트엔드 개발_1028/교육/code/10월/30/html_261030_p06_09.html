<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1">
        <title>블루베리 팔아요</title>
        <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>        
        <script>
            $(
                function(){
                    var copyObj = $(".box1").children().clone();
                    $(".box2").remove();

                    $(".box3").empty();
                    $(".box3").append(copyObj);

                    $("h2").replaceWith("<h3>replace method</h3>");
                    $("<p>Change</p>").replaceAll("div")
                }
            )
        </script>
        <style>
            .box1, .box2, .box3, .box4{
                border: 1px solid gray;
            }
        </style>
    </head>
    <body>
        <div class="box1">
            <p>내용1</p>
            <p>내용2</p>
        </div>
        <div class="box2">
            <p>내용3</p>
            <p>내용4</p>
        </div>
        <div class="box3">
            <p>내용5</p>
            <p>내용6</p>
        </div>
        
        <section class="sec1">
            <h2>제목1</h2>
            <div>내용1</div>
            <div>내용2</div>
        </section>
        <section class="sec2">
            <h2>제목2</h2>
            <div>내용3</div>
            <div>내용4</div>
        </section>
    </body>
</html>
