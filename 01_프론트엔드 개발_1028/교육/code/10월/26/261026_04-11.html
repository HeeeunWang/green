<!DOCTYPE html>
<html lan="ko">
    <head>
        <meta charset="utf-8">
        <title>HTML5 문서</title>
        <style>
            nav{}
            nav ul{
                list-style-type: none;
                display:inline;
            }
            nav ul li{
                display:inline;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>반려동물 종류</h1>
            <nav>
                <ul>
                    <li>반려동물 종류</li>
                    <li>입양하기</li>
                    <li>건강돌보기</li>
                    <li>더불어살기</li>
                </ul>
            </nav>
        </header>
        <section>
            <h2>반려 강아지</h2>
            <article>
                <h3>요크셔테리어</h3>
                <p>생기있고 활달한 성질을 가지고 있음</p>
            </article>
            <article>
                <h3>말티즈</h3>
                <p>애정이 많고 충실</p>
            </article>
        </section>
        <section>
            <h2>반려 고양이</h2>
            <article>
                <h3>코리안 숏헤어</h3>
                <p>한국 길고양이로 다양한 무늬가 있음</p>
            </article>
            <article>
                <h3>벵갈</h3>
                <p>호기심 많고 활발</p>
            </article>
        </section>
    </body>
</html>
