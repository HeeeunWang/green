<!DOCTYPE html>
<html lan="ko">
    <head>
        <meta charset="utf-8">
        <title>새로 만들기</title>
        <style>
            /* *{
                margin: 0px;
                padding: 0px;
            } */
            ul li{
                float: left;
                /* display: inline-block; */
                border: 1px solid gray;
                width: 100px;
                text-decoration: none;
                list-style: none;
                text-align: center;
            }
            ul li:first-child{
                border-top-left-radius: 10px;
                border-bottom-left-radius: 10px;
            }
            ul li:last-child{
                border-top-right-radius: 10px;
                border-bottom-right-radius: 10px;
            }
        </style>
    </head>
    <body>
        <ul>
            <li>Home</li>
            <li>HTML5</li>
            <li>CSS3</li>
            <li>JQuery</li>
        </ul>
    </body>
</html>
