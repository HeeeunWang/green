<!DOCTYPE html>
<html lan="ko">
    <head>
        <meta charset="utf-8">
        <title>TEST!</title>
        <style>
            header{
                position: relative;
                background-image: url("헤더.jpg");
                height: 300px;
                margin-bottom: 0px;
                background-size: contain;
                min-width: 1200px;
            }
            header h1{
                position: absolute;
                left: 30px;
                bottom: 70px;
                font-size: 60px;
                color: white;
                padding: 20px;
            }
            header h2{
                position: absolute;
                left: 30px;
                bottom: 30px;
                font-size: 20px;
                color: yellowgreen;
                padding-right: 20px;
            }
            .navi{
                bottom: 00px;
                background-color: rgb(21, 44, 21);
                height: 40px auto;
            }
            .navi a, .navi a:visited{
                color: white;
            }
            .navi a:hover, .navi a:active, .navi a:focus{
                text-shadow: 0px 2px 2px black;
                color: yellowgreen;
            }
            .navi ul{
                list-style-type: none;
                margin-top: 0;
            }
            .navi ul li{
                display:inline-block;
                background-color: rgb(21, 59, 21);
                color: white;
                width: 150px;
                vertical-align: middle;
                text-align: center;
                margin: 8px;
                margin-left: 0;
            }
            img{
                width: 200px;
                height: 200px;
                display: inline-block;
            }
            dl{
                padding: 10px;
            }
            dl dt{
                background-color: lightgray;
                padding-left: 10px;
            }
            dl dd{
                padding-top: 10px;
                display: inline-block;
            }
            .articlebox{
                display: inline;
                float: left;
                /* width: 70%; */
                width: 900px;
            }
            .asidebox{
                border: 1px solid gray;
                border-radius: 10px;
                display: inline;
                float: right;
                width: 250px;
                padding: 10px;
            }
            .section1{
                /* min-width: 1000px; */
                width: 1200px;
                align-content: center;
                margin: 0 auto;
            }
            .maker{
                border: 1px solid lightgray;
                border-radius: 10px;
                padding: 10px;
                margin-bottom: 5px;
            }
            .footerbox{
                background: lightgray;
                padding: 10px;
                padding-left: 50px; 
                height: 150px;
                min-width: 1200px;
            }
            .footermulti{
                /* clear: both; */
                column-count: 2;
                background: lightgray;
                padding: 10px;          
            }
            .footermulti h4{
                break-before: column;
            }
            .footerdiv1{
                display: inline;
                float: left;
                width: 350px;
                margin: 0;
            }
            .footerdiv2{
                
                display: inline;
                float: left;
                width: 350px;
                margin: 0;
            }
            #section2{
                width: 500px;
            }
            
        </style>
    </head>
