<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1">
        <title>블루베리 팔아요</title>
        <style>
            *{
                margin:0;
                padding:0;
            }
            img{                
                display: block;
                margin: 0 auto;
                border: 1px solid gray;
            }
            h1{
                text-align: center;
            }
            #galleryZone{
                position: relative;
                margin: 0 auto;
                text-align: center;
                width: 700px;
                height: 400px;
                border: 1px dotted gray;
            }
            #galleryZone input[type="image"]{
                margin: 0 8px;                
            }
            .bfbutton{
                position: absolute;
                left: 0;
                bottom: 0;
                width: 100px;
            }
            .nxbutton{
                position: absolute;
                right: 0;
                bottom: 0;
                width: 100px;
            }
        </style>
        <script>
            var galnum = 1;
            function gallery(direct){
                if(direct){
                    if(galnum==8) return
                    galnum++;
                }else{
                    if(galnum==1) return
                    galnum--;
                }
                var imgTag = document.getElementById("photo");
                imgTag.setAttribute("src", "pic_0"+galnum+".png");
            }
        </script>
    </head>
    <body>
        <h1>이곳은 당신의 갤러리!</h1>
        <div id="galleryZone">
            <img src="pic_01.png" id="photo">
            <button onclick="gallery(0)" class="bfbutton">이전</button>
            <button onclick="gallery(1)" class="nxbutton">다음</button>
        </div>
    </body>
</html>
