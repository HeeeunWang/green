<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1">
        <title>새 창 띄우기</title>
        <script>
            var addNum = 0;
            var subNum = 1000;

            var auto_1 = setInterval(
                function(){addNum++; console.log("addNum: ", addNum);}
                , 1000
            );
            
            var auto_2 = setInterval(
                function(){subNum--; console.log("subNum: ", subNum);}
                , 1000
            );
        </script>
    </head>
    <body>
        <h1>일정 시간 간격으로 값 증감시키기</h1>
        <p>콘솔에서 확인!</p>
        <button onclick="clearInterval(auto_1)">증가 정지</button>
        <button onclick="clearInterval(auto_2)">감소 정지</button>
        <button onclick="location.reload()">새로고침</button>
        <p></p>
        <script>
            document.write("이 문서의 주소: "+location.herf, "<br>");
            document.write("이 문서의 호스트: "+location.hostname, "<br>");
            document.write("이 문서의 경로: "+location.pathname, "<br>");
        </script>        
    </body>
</html>
