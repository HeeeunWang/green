<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1">
        <title>블루베리 팔아요</title>
        <script>
            var tv = new Object();
            tv.color = "white";
            tv.price = 300000;
            tv.info = function() {
                document.write("tv의 색상은 ", this.color, "<br>");
                document.write("tv의 가격은 ", this.price, "<br>");
            };
            var car = {
                color: "black",
                price: 5000000,
                info: function() {
                    document.write("car의 색상은 ", this.color, "<br>");
                    document.write("car의 가격은 ", this.price, "<br>");
                }
            };
            document.write("<h1>tv 객체 메서드 호출</h1>");
            tv.info();            
            document.write("<h1>car 객체 메서드 호출</h1>");
            car.info();
            car.info;
            document.write(tv.info);
        </script>
    </head>
    <body>

    </body>
</html>
