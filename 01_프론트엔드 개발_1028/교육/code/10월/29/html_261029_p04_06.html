<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1">
        <title>가위 바위 보 게임</title>
        <script>
            var userName = prompt("당신의 영문 이름은?", "");
            var upperName = userName.toUpperCase();

            document.write("당신의 영문 이름은?<br>")
            document.write(upperName, "<br>");

            var userNum = prompt("당신의 연락처는?", "");
            var result = userNum.slice(0, userNum.length-4)+"****";

            document.write("당신의 연락처는?<br>")
            document.write(result, "<br>")

            userNum.replace(userNum.slice(userNum.length-4, userNum.length), "****");
            document.write(userNum, "<br>")

        </script>
    </head>
    <body>

    </body>
</html>
