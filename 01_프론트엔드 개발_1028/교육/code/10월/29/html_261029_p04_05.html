        <title>가위 바위 보 게임</title>
        <script>
            var arr_1 = ["사당", "교대", "방배", "강남"];
            var arr_2 = ["신사", "압구정", "옥수"];

            var result = arr_1.join("~");
            console.log(result);

            var result = arr_1.toString();
            console.log(result);

            result = arr_1.concat(arr_2)
            console.log(result);

            result = arr_1.slice(1, arr_1.length-1);
            console.log(result);

            result = arr_1.sort();
            console.log(result);
            // arr_1.sort();
            console.log(arr_1);

            result = arr_2.reverse();
            console.log(result);
            console.log(arr_2);
            arr_2.reverse();
            console.log(arr_2);

        </script>
