<!DOCTYPE html>
<html lan="ko">
    <head>
        <meta charset="utf-8">
        <title>position 속성</title>
        <style>
            .box1{
                float: left;
                width: 100px;
                background: rgb(255, 230, 0);
                margin-right: 10px;
                padding: 20px;
            }
            .box2{
                position:relative;
                float: left;
                left:-50px;
                top:30px;
                width: 300px;
                background: rgb(0, 60, 255);
                padding: 20px;
            }
        </style>
    </head>

    <body>
        <div class="box1">box1</div>
        <div class="box2">box2</div>
    </body>
</html>
