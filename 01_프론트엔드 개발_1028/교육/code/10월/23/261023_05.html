<!DOCTYPE html>
<html lan="ko">
    <head>
        <meta charset="utf-8">
        <title>display 속성</title>
        <style>
            nav ul{
                list-style-type: none;
            }
            nav ul li{
                display: inline-block;
                padding: 10px 45px;
                margin-right: 50px;
                border-top: 3px solid #222;
            }
            nav ul li:hover{
                background-color: gray;
            }
            nav ul li a{
                color:black;
                text-decoration:none;
            }
        </style>
    </head>

    <body>
        <nav>
            <ul>
                <li><a herf="#"></a>반려견종류</li>
                <li><a herf="#"></a>입양하기</li>
                <li><a herf="#"></a>건강돌보기</li>
                <li><a herf="#"></a>더불어살기</li>
            </ul>
        </nav>
    </body>
</html>
