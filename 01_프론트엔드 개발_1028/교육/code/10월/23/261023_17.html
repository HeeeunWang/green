<!DOCTYPE html>
<html lan="ko">
    <head>
        <meta charset="utf-8">
        <title>layout</title>
        <style>
            div{
                margin: 5px;
                padding: 10px;
                /* height: 150px; */
            }
            .titlebox{
                border: 1px solid gray;                
            }
            .mainbox{
                float: left;
                border: 1px solid gray;
                width: 57%;
                box-sizing: border-box;
            }
            .sidebarbox{
                float: right;
                border: 1px solid gray;
                width: 40%;
                box-sizing: border-box;
                background-color: #5e5e5e;
            }
            .putterbox{
                border: 1px solid gray;
                clear: both;
            }
        </style>
    </head>

    <body>
        <div class="titlebox">
            <h1>사이트 제목</h1>
        </div>

        <div class="sidebarbox">
            <h2>사이드 바</h2>
            <ul>
                <li>모든 국민은 근로의 의무를 진다. 국가는 근로의 의무의 내용과 조건을 민주주의원칙에 따라 법률로 정한다.</li>
            </ul>
        </div>

        <div class="mainbox">
            <h3>본문</h3>
            <p>재산권의 행사는 공공복리에 적합하도록 하여야 한다. 정부는 회계연도마다 예산안을 편상하여 회계연도 개시 90일전까지 국회에 제출하고, 국회는 회계연도 개시 30일전까지 이를 의결하여야 한다.</p>    
            <p>대통령의 임기가 만료되는 대에는 임기만료 70일 내지 40일전에 후임자를 선거한다.</p>
        </div>
        
        <div class="putterbox">
            <h4>푸터</h4>
            <p>푸터 내용</p>
        </div>
        
        
    </body>
</html>
