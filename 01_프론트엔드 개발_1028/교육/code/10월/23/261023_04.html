<!DOCTYPE html>
<html lan="ko">
    <head>
        <meta charset="utf-8">
        <title>display 속성</title>
        <style>
            div{
                margin:20px;
                border: 1px solid gray;
                border-radius: 10px;
            }
            #inline img{
                margin:10px;
            }
            #block img{
                display: block;
                margin:10px;
            }
        </style>
    </head>

    <body>
        <div id="inline">
            <img src="치이.jpg">
            <img src="하치.jpg">
            <img src="사기.jpg">
        </div>
        <div id="block">
            <img src="치이.jpg">
            <img src="하치.jpg">
            <img src="사기.jpg">
        </div>
    </body>
</html>
