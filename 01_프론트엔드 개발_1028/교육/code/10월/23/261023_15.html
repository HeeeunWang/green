<!DOCTYPE html>
<html lan="ko">
    <head>
        <meta charset="utf-8">
        <title>floating</title>
        <style>
            .box1{
                padding: 20px;
                margin-right: 10px;
                background: rgb(255, 208, 0);
                float: left;
            }
            .box2{
                padding: 20px;
                margin-right: 10px;
                background: rgb(0, 255, 85);
                float: left;
            }
            .box3{
                padding: 20px;
                margin-right: 10px;
                background: rgb(0, 110, 255);
                float: left;
            }
            .box4{
                padding: 20px;
                margin-right: 10px;
                background: rgb(255, 0, 106);
                float: right;
            }
        </style>
    </head>
    
    <body>
        <div class="box1">box1</div>
        <div class="box2"></div>
        <div class="box3">box3</div>
        <div class="box4">box4</div>
    </body>
</html>
