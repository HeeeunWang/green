<!DOCTYPE html>
<html lan="ko">
    <head>
        <meta charset="utf-8">
        <title>박스 모델</title>
        <style>
            div{
                width:200px;
                height:100px;
                display:inline-block;
                margin: 15px;
                border-width: 5px;
                border-style: dashed;
            }
            .box1{
                border-color: red;
                border-style: dashed;
            }
            .box2{
                border-color: blue;
                border-style: solid;
            }
        </style>
    </head>

    <body>
        <div class="box1"></div>
        <div class="box2"></div>
    </body>
</html>
