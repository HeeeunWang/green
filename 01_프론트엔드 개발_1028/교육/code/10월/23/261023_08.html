<!DOCTYPE html>
<html lan="ko">
    <head>
        <meta charset="utf-8">
        <title>아직도 박스모델</title>
        <style>
            div{
                width: 300px;
                height: 200px;
                margin: 20px;
                display: inline-block;
            }
            .round{
                border: 2px solid red;
                border-radius: 20px;
            }
            .round2{
                border: 2px solid gray;
                border-radius: 70px 20px;
            }
            #bg{
                background: url(../22/261022_마늘한알.jpg);
                background-size: cover;
            }
        </style>
    </head>

    <body>
        <div class="round"></div>
        <div class="round2", id="bg"></div>
        <div class="round", id="bg"></div>
    </body>
</html>
