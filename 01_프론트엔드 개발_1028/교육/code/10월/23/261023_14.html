<!DOCTYPE html>
<html lan="ko">
    <head>
        <meta charset="utf-8">
        <title>floating</title>
        <style>
            #container{
                width:800px;
                margin:20px auto;
                padding:20px;
            }
            .left-img{
                float:left;
                margin-right: 25px;
            }
            p{
                line-height: 30px;
            }
        </style>
    </head>

    <body>
        <div id="container">
            <img src="사기.jpg" class="left-img" alt="">
            <h1>바쁜 현대인의 소확행</h1>
            <h2>소소한 줄 알고 쓰다가 파산해요!</h2>
            <p>
                하지만 너무 귀엽죠? 어떡하겠어요 파산해야지 힘내시던가요
                언제까지 힘내야 할지는 저도 잘 모르겠네요 제 미래가 치이카와
                심연보다 더 깊고 어둡거든요
            </p>
            <p></p>
        </div>
    </body>
</html>
