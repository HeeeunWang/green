<!DOCTYPE html>
<html lan="ko">
    <head>
        <meta charset="utf-8">
        <title>초콜릿이란</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200..900&display=swap');
            .krnoto {
            font-family: "Noto Serif KR", serif;
            font-optical-sizing: auto;            
            }
            body{
                background-color: #E5CCF0FF;
            }
            div{
                background-color: #CCE3F0FF;
                padding: 30px;
                border: 1px solid black;
            }
            h1{
                /* border: 1px solid gray; */
            }
            p{
                text-align: justify;
                line-height: 30px;
                /* border: 1px solid gray; */
            }
        </style>
    </head>

    <body>
        <div>
            <h1>초콜릿</h1>
            <p>
                초콜릿은 카카오 콩을 재료로 가공한 식품!<br>
                숙성한 카카오 콩을 볶은 뒤 이를 갈아서 만든 카카오 매스와 지방 성분만으로 만들어진
                코코아 버터를 혼합하여 만드는데, 설탕 등의 다른 재료를 더 넣어 만들기도 한다.
                카카오 매스의 함량에 따라 다크, 밀크, 화이트 초콜릿으로 구분한다.                
            </p>
        </div>
    </body>
</html>
