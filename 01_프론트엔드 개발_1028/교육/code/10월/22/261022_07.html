<!DOCTYPE html>
<html lan="ko">
    <head>
        <meta charset="utf-8">
        <title>배경 이미지</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200..900&display=swap');
            .krnoto {
            font-family: "Noto Serif KR", serif;
            font-optical-sizing: auto;            
            }
            div{
                width:500px;
                height:500px;
                border: 2px double black;
                margin-bottom: 20px;
            }
            .bg1{
                background: url("261022_마늘한알.jpg") no-repeat left top;
                background-size: auto;
            }
            .bg2{
                background: url("261022_마늘한알.jpg") no-repeat left top;
                background-size: 200px 150px;
            }
            .bg3{
                background: url("261022_마늘한알.jpg") no-repeat left top;
                background-size: 60% 40%;
            }
            .bg4{
                background: url("261022_마늘한알.jpg") no-repeat left top;
                background-size: contain;
            }
            .bg5{
                background: url("261022_마늘한알.jpg") no-repeat left top;
                background-size: cover;
            }
            .bg6{
                background: url("261022_마늘한알.jpg") no-repeat left top;
                background-size: 100% 100%;
            }
        </style>
    </head>

    <body>
        <div class="bg1"></div>
        <div class="bg2"></div>
        <div class="bg3"></div>
        <div class="bg4"></div>
        <div class="bg5"></div>
        <div class="bg6"></div>
    </body>
</html>
