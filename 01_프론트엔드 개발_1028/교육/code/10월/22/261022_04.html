<!DOCTYPE html>
<html lan="ko">
    <head>
        <meta charset="utf-8">
        <title>list style 바꾸기</title>
        <style>
            .robullet{
                list-style-type: upper-alpha;
                list-style-position: inside;
            }
            ul{
                list-style: inside square; 
            }
            ol{
                list-style: lower-alpha;
            }
            /* .sqbullet{
                
            } */
            .imbullet{
                list-style: url(261022_미니블루베리.jpg);
            }
            .nobullet{
                list-style: none;
            }
        </style>
    </head>
    <body>
        <h1>이지스퍼블리싱</h1>
        <ol class="robullet">
            <li>회사소계</li>
            <li>도서</li>
            <li>자료실</li>
            <li>질문답변</li>
            <li>동영상강의</li>
        </ol>
        <ol>
            <li>회사소계</li>
            <li>도서</li>
            <li>자료실</li>
            <li>질문답변</li>
            <li>동영상강의</li>
        </ol>
        <ul>
            <li>회사소계</li>
            <li>도서</li>
            <li>자료실</li>
            <li>질문답변</li>
            <li>동영상강의</li>
        </ul>
        <ul class="imbullet">
            <li>회사소계</li>
            <li>도서</li>
            <li>자료실</li>
            <li>질문답변</li>
            <li>동영상강의</li>
        </ul>
        <ul class="nobullet">
            <li>회사소계</li>
            <li>도서</li>
            <li>자료실</li>
            <li>질문답변</li>
            <li>동영상강의</li>
        </ul>
    </body>
</html>
