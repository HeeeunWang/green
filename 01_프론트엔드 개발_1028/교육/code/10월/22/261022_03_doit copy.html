<!DOCTYPE html>
<html lan="ko">
    <head>
        <meta charset="utf-8">
        <title>블루베리 팔아요</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200..900&display=swap');
            .krnoto {
            font-family: "Noto Serif KR", serif;
            font-optical-sizing: auto;            
            }
            
            section{
                width:500px
            }
            div{
                padding: 5px;
                border: 1px solid #ccc;
            }
            
            .bg1{
                height:300px;
                background: url("261022_블루베리.jpg") no-repeat left top;
                background-size: 100% 100%;
            }
            .bg2{
                background-color:black;
                padding-top:1px;
                padding-bottom:0px;
            }
            .bg3{
                background-color:navy;
                background-clip:border-box;
                background-position: center bottom;
            }

            h1{
                font-size: 15px;
                line-height: 1.5;    
                color:white;            
            }
            h2{
                font-size: 15px;
                line-height: 0.7;
                color: red;
                text-align: center;
            }
            h3{
                font-size: 30px;
                color: white;
            }
            p{
                font-size: 25px;
                line-height: 1.3;
                text-align: center;
            }            
            .covertxt{
                font-size: 15px;
                color: orange;
                text-align: left;
            }
            .highlight{
                color: navy;
            }
            .calltxt{
                font-size:10px;
            }
        </style>
    </head>
    <body>        
        <section class="bg1">
            <div class="bg3">
                <h3>냉동 블루베리</h3>
                <p class="covertxt">
                    급속 냉동으로 맛과 영양은 그대로입니다<br>
                    냉동실에 구비해두시고 사계절 즐기세요
                </p>                
            </div>
        </section>

        <section>
            <div class="bg2">
                <h1>확인하세요</h1>
            </div>
            <div>
                <h2>주문 및 배송</h2>
                <b><p>                
                    <span class="highlight">오후 2시 이전</span> 주문건은 당일 발송합니다<br>
                    2시 이후 주문건은 다음날 발송합니다<br>
                    (주말 제외)<br>
                </p></b>
            </div>
            <div>
                <h2>교환 및 환불</h2>
                <b><p>                
                    불만즉시 <span class="highlight">100% 환불</span>해 드립니다<br>
                    고객센터로 전화주세요<br>
                </p></b>
            </div>
            <div>
                <h2>고객센터</h2>
                <b><p>                
                    000-0000-0000<br>                
                </p></b>
                <p class="calltxt">
                    상담시간: 오전 9시 ~ 오후 6시 (토/일, 공휴일 휴무)<br>
                </p>
            </div>
        </section>

    </body>
</html>
