<!DOCTYPE html>
<html lan="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1">
        <title>Media Query</title>
        <style>
            *{
                padding: 0;
                margin: 0;
                box-sizing: border-box;
            }
            body{
                background: rgb(13, 73, 53);
            }
            #container{
                width: 320px;
                margin: 50px auto;
                /* border: 1px solid red; */
            }
            .card{
                position: relative;
                width: 320px;
                height: 500px;
                margin: 20px 0px;
                background: white;
                /* border: 1px solid blue; */
            }
            .words{
                position: absolute;
                top: 300px;
                left: 10px;
                width: 300px;
                padding: 10px;
                background: white;
                text-align: center;
                /* border: 1px solid gray; */
            }
            .imgsize{
                width: 320px;
                height: 300px;                
            }

            @media screen and (min-width:770px) and (max-width:1700px){
                *{
                    padding: 0;
                    margin: 0;
                    box-sizing: border-box;
                }
                #container{
                    width: 620px;
                    margin: 50px auto;
                }
                .card{
                    position: relative;
                    width: 620px;
                    height: 300px;
                    margin: 20px 00px;
                    background: white;
                }
                .words{
                    position: absolute;
                    top: 50px;
                    left: 320px;
                    width: 300px;
                    padding: 10px;
                    background: white;
                    text-align: center;
                }
                .imgsize{
                    width: 320px;
                    height: 300px;                
                }
            }

            @media screen and (min-width:1700px){
                #container{
                    width: 1700px;
                    margin: 50px auto;
                }
                .card{
                    position: relative;
                    float: left;
                    width: 520px;
                    height: 500px;
                    margin: 20px 0px;
                    background: white;
                }
                .words{
                    position: absolute;
                    top: 400px;
                    left: 10px;
                    width: 500px;
                    padding: 10px;
                    background: white;
                    text-align: center;
                }
                .imgsize{
                    width: 520px;
                    height: 400px;                
                }
            }

        </style>
    </head>
    <body>
        <div id="container">
            <div class="card">
                <img class="imgsize" src="아노코.jpg">
                <div class="words">
                    <h2>일 분 전만큼 먼 시간은 없다</h2>
                    <h3>- Jim Bishop</h3>
                </div>
            </div>
            <div class="card">
                <img class="imgsize" src="해피멍뭉.jpg">
                <div class="words">
                    <h2>웃음은 마음의 조깅이다</h2>
                    <h3>- Norman Cousins</h3>
                </div>
            </div>
            <div class="card">
                <img class="imgsize" src="수묵화.jpg">
                <div class="words">
                    <h2>낡은 옷은 그냥 입고 새 책을 사라</h2>
                    <h3>- Austin Phelps</h3>
                </div>
            </div>
        </div>
    </body>
</html>
