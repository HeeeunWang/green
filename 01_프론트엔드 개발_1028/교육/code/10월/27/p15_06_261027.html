<!DOCTYPE html>
<html lan="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1">
        <title>Media Query</title>
        <style>
            body{
                background: #eee;
            }
            @media screen and (orientation: landscape) {
                body{
                    background: orange;
                }
            }
            @media screen and (orientation: portrait) {
                body{
                    background: yellow;
                }
            }
        </style>
    </head>
    <body>
        <p>Media Query</p>
    </body>
</html>
