<!DOCTYPE html>
<html lan="ko">
    <head>
        <meta charset="utf-8">
        <title>고정 그리드</title>
        <style>
            #wrapper{
                width: 960px;
                margin: 0 auto;
                text-align: center;
                vertical-align: middle;
            }
            .headergrid{
                width: 960px;
                height: 120px;
                background: blue;
            }
            .maingrid{
                float: left;
                width: 600px;
                height: 400px;
                padding: 15px;
                background: yellow;
            }
            .sidebargrid{
                float: right;
                width: 300px;
                height: 400px;
                padding: 15px;
                background: green;
            }
            .footergrid{
                clear: both;
                height: 120px;
                background: brown;
            }
        </style>
    </head>
    <body>
        <div id="wrapper">
            <header class="headergrid">
                <h1>Header</h1>
            </header>
            <section class="maingrid">
                <h4>Main</h4>
            </section>
            <aside class="sidebargrid">
                <h4>sidebar</h4>
            </aside>
            <footer class="footergrid">
                <h4>footer</h4>
            </footer>
        </div>
    </body>
</html>
