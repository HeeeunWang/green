<!DOCTYPE html>
<html lan="ko">
    <head>
        <meta charset="utf-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1">
        <title>어케하ㅡㄴ겨22</title>
        <style>
            *{
                padding: 0;
                margin: 0;
                box-sizing: border-box;
            }
            #container{
                margin: 0 auto;
                width: 550px;
                height: auto;
                padding: 10px;
                box-sizing: border-box;
                display: flex;
                flex-wrap: wrap;
                border: 1px dotted green;     
                justify-content: center;
            }
            .headerbox{
                width: 80%;
                height: 100px;
                border: 1px solid gray;
                text-align: center;
            }
            .boxwrapper{
                width: 80%;
                display: flex;
                flex-wrap: wrap;
            }
            .box1, .box2, .box3, .box4, .box5{
                width: 100%;
                height: 300px;
                border: 1px solid gray;
                text-align: center;
            }
            .footerbox{
                border: 1px solid gray;
                text-align: center;
                width: 80%;
                height: 100px;
            }    
            @media screen and (min-width: 900px) {
                #container{
                    width: 750px;
                    height: auto;
                    padding: 10px;
                    box-sizing: border-box;
                    flex-wrap: wrap;
                }
                .headerbox, .footerbox, .box5{
                    width: 80%;
                }
                .box1, .box2, .box3, .box4, .box5{
                    width: 50%;
                }
                .box5{
                    flex: 2 2 0;
                }
            }
            @media screen and (min-width: 1200px) {
                #container{
                    width: 1050px;
                    height: auto;
                    padding: 10px;
                    box-sizing: border-box;
                    flex-wrap: wrap;
                }
                .headerbox, .footerbox{
                    width: 80%;
                }
                .box1, .box2, .box3, .box4, .box5{
                    width: 33.33%;
                }
                .box5{
                    flex: 2 2 0;
                }
            }             
        </style>
    </head>
    <body>        
        <div id="container">
            <header class="headerbox">
                <h1>사이트 제목</h1>
            </header>
            <section id="box" class="boxwrapper">
                <div class="box1">
                    <h2>메인 박스 01</h2>
                </div>
                <div class="box2">
                    <h2>메인 박스 02</h2>
                </div>
                <div class="box3">
                    <h2>메인 박스 03</h2>
                </div>
                <div class="box4">
                    <h2>메인 박스 04</h2>
                </div>
                <div class="box5">
                    <h2>메인 박스 05</h2>
                </div>
            </section>
            <footer class="footerbox">
                <h1>푸터</h1>
            </footer>
        </div>        
    </body>
</html>
